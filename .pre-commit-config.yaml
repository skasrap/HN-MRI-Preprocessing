repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        args: [--check]
        stages: [manual]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout  # notebook outputs can contain patient IDs and images
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: block-imaging-data
        name: Block medical imaging / tensor files
        entry: Imaging or tensor files must not be committed (patient data).
        language: fail
        files: '\.(dcm|nii|nii\.gz|nrrd|mha|npy|npz|tfm)$'
